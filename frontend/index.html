<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Wall | Muro de Comentarios</title>
    <link rel="icon" href="assets/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/output.css">
</head>

<body class="bg-[#0e1113] text-gray-300 min-h-screen font-sans flex flex-col">

    <header class="bg-[#0e1113] sticky top-0 z-50 border-b border-white/10 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <figure class="flex items-center gap-3">
                    <h1 class="text-[#ff6400] font-bold leading-none text-lg">Comment Wall</h1>
                </figcaption>
            </figure>

        </div>
    </header>

    <main class="p-6 max-w-3xl mx-auto space-y-8 grow w-full">
        <section aria-labelledby="form-title" class="space-y-6 py-4">
            <div class="text-center">
                <h2 id="form-title" class="text-3xl font-bold text-white">Un muro para <span class="text-[#ff6400]">
                        compartir ideas</span></h2>
                <p class="text-gray-500 text-sm mt-2">Comparte lo que tienes en mente</p>
            </div>

            <form onsubmit="event.preventDefault(); createNewComment();" class="flex flex-col sm:flex-row gap-3 group">
                <div class="relative sm:w-1/3">
                    <label for="userInput" class="sr-only">Nuevo usuario</label>
                    <input type="text" id="userInput" placeholder="Tu usuario" maxlength="20" required
                        class="bg-[#1c1c1c] border border-white/10 w-full pl-5 pr-4 py-3 rounded-xl focus:outline-none focus:border-[#ff6400]/50 focus:ring-[#ff6400]/20 text-white placeholder-gray-600 transition-all shadow-inner">
                </div>

                <div class="relative grow">
                    <label for="commentInput" class="sr-only">Nuevo comentario</label>
                    <input type="text" id="commentInput" placeholder="Escribe un comentario" maxlength="100" required
                        class="bg-[#1c1c1c] border border-white/10 w-full pl-5 pr-4 py-3 rounded-xl focus:outline-none focus:border-[#ff6400]/50 focus:ring-[#ff6400]/20 text-white placeholder-gray-600 transition-all shadow-inner">
                </div>

                <button type="submit"
                    class="bg-[#ff6400] text-white px-8 py-3 rounded-xl text-sm font-bold hover:bg-[#ae2c00] transition-all shadow-lg shadow-[#ff6400]/10 shrink-0">
                    Publicar
                </button>
            </form>
        </section>

        <div id="loading" role="status" class="text-center py-4 hidden">
            <div class="animate-spin inline-block w-6 h-6 border-2 border-[#ff6400] border-t-transparent rounded-full">
            </div>
        </div>

        <section aria-labelledby="wall-title" class="space-y-4">
            <h3 id="wall-title" class="sr-only">Lista de comentarios</h3>

            <div id="main-comment-container" class="flex flex-col gap-3 min-h-[200px]">
                <div id="lista-comentarios" class="flex flex-col gap-3">
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-[#0e1113] border-t border-white/5 w-full mt-auto">
        <div class="max-w-4xl mx-auto px-6 py-8 text-center">
            <p class="text-gray-600 text-xs tracking-wide">
                Desarrollado por <span class="text-[#ff6400] font-medium">Jorge Luis Duarte Ruiz</span>
            </p>
        </div>
    </footer>

    <script src="js/functions.js"></script>
</body>

</html>
